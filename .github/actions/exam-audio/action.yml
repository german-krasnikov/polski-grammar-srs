name: Restore verified exam audio
description: Restore the pinned web audio archive and verify each DSL-pinned MP3.
runs:
  using: composite
  steps:
    - name: Download pinned audio archive
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        mkdir -p "$RUNNER_TEMP/exam-audio-release"
        gh release download exam-audio-v2 --pattern polski-exam-web-audio-v2.tar --dir "$RUNNER_TEMP/exam-audio-release" --clobber
        cd "$RUNNER_TEMP/exam-audio-release"
        echo '452ca8f4c185fdd910707172b06c9742c11480c0582c9e7d9af4bca4c78e24f3  polski-exam-web-audio-v2.tar' | sha256sum --check
        "$GITHUB_WORKSPACE/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/scripts/verify-exam-web-audio-archive.ts" "$RUNNER_TEMP/exam-audio-release/polski-exam-web-audio-v2.tar"
        tar -xf polski-exam-web-audio-v2.tar -C "$GITHUB_WORKSPACE"
    - name: Verify and stage all effective web MP3 files
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npx tsx scripts/prepare-exam-audio.ts prepare --offline
